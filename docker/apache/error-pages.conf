# Páginas de erro do Apache, para falhas que acontecem antes de o Laravel responder
# (PHP caído, proxy do Reverb sem resposta). Respostas geradas pelo Laravel, com corpo
# próprio, NÃO são substituídas. Arquivos estáticos em public/errors.
ErrorDocument 500 /errors/500.html
ErrorDocument 502 /errors/502.html
ErrorDocument 503 /errors/503.html
ErrorDocument 504 /errors/504.html

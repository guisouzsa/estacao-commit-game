# Desempenho com 2 processos Apache (512 MB de RAM) -----------------------------------
#
# 1) Conexões persistentes ociosas prendem um processo prefork inteiro. Com só 2
#    processos, 5 s de keep-alive (padrão) deixavam o site esperando por conexões que
#    não faziam nada. 1 s basta para reaproveitar a conexão entre os arquivos de uma página.
KeepAlive On
KeepAliveTimeout 1
MaxKeepAliveRequests 100

# 2) Arquivos do build têm hash no nome (mudam de nome quando mudam de conteúdo), então
#    o navegador pode guardá-los por um ano. Na segunda visita nenhuma dessas requisições
#    chega ao servidor, deixando os 2 processos livres para as páginas.
<IfModule mod_headers.c>
    <LocationMatch "^/build/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # Imagens do jogo (tabuleiro, cartas, mascotes) não têm hash no nome, mas quase nunca mudam:
    # 7 dias de cache e, depois disso, o navegador ainda usa a cópia enquanto confere uma nova
    # em segundo plano (stale-while-revalidate): nunca fica esperando por imagem já conhecida.
    <LocationMatch "^/images/">
        Header set Cache-Control "public, max-age=604800, stale-while-revalidate=86400"
    </LocationMatch>
</IfModule>

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

# Processos que rodam como www-data herdam HOME=/root do supervisord, e o
# PostgreSQL (libpq) tenta ler /root/.postgresql/postgresql.crt: "Permission
# denied" e nenhuma conexão com o banco. HOME próprio resolve.
[program:reverb]
command=/usr/local/bin/php /var/www/html/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/html
user=www-data
environment=HOME="/var/www"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# Executa o scheduler do Laravel (rooms:expire-waiting a cada minuto). Um único
# processo: schedule:work dispara schedule:run uma vez por minuto. Não é
# "essencial": se falhar de vez, o app segue no ar e a expiração continua
# acontecendo sob demanda ao abrir/entrar na sala.
[program:scheduler]
command=/usr/local/bin/php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
environment=HOME="/var/www"
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# Se um processo essencial (apache ou reverb) entrar em FATAL, ou seja, esgotar
# as tentativas de iniciar, o supervisord encerra o container para que a
# plataforma o reinicie, em vez de manter um container "vivo" porém quebrado.
[eventlistener:essential-watchdog]
command=python3 /usr/local/bin/essential-watchdog.py apache reverb
events=PROCESS_STATE_FATAL
autostart=true
autorestart=true
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

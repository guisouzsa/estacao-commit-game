<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Algo deu errado do nosso lado — Estação Commit</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#1d1d1b;color:#1d1d1b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:36rem;border:3px solid #000;background:#f3f1ec;padding:28px;box-shadow:8px 8px 0 #464498}
.brand{font-weight:900;letter-spacing:.02em}.brand span{color:#464498}.code{margin:28px 0 0;font:700 12px ui-monospace,Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;color:#464498}
h1{margin:8px 0 0;font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.15}p{line-height:1.7;color:#5b5953}
.steps{margin:18px 0 0;padding:0;list-style:none;font:600 13px ui-monospace,Consolas,monospace;color:#5b5953}.steps li{padding:3px 0}.steps li:before{content:"$ ";color:#464498}
.bar{margin-top:18px;height:10px;border:2px solid #1d1d1b;background:#fff;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:#b4da33;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
.auto{margin-top:14px;font:700 12px ui-monospace,Consolas,monospace;color:#464498;min-height:1.4em}
a,button{display:inline-flex;min-height:48px;align-items:center;justify-content:center;margin:12px 8px 0 0;padding:0 20px;border:2px solid #1d1d1b;background:#b4da33;color:#1d1d1b;font:900 13px ui-monospace,Consolas,monospace;text-transform:uppercase;text-decoration:none;box-shadow:4px 4px 0 #1d1d1b;cursor:pointer}
a.alt{background:#fff;box-shadow:4px 4px 0 #b4da33}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style></head><body><main>
<div class="brand">ESTAÇÃO <span>COMMIT</span></div>
<p class="code">Erro 500</p><h1>Algo deu errado do nosso lado</h1><p>Não foi você. Já registramos o problema e sua partida não foi apagada. Tente de novo em alguns instantes.</p>

<button type="button" onclick="location.reload()">Tentar de novo</button><a class="alt" href="/">Voltar ao início</a>
</main></body></html>
